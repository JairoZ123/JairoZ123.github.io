<!DOCTYPE html>
<html>
    <head>
        <title>My 10 Favorite Things</title>
    </head>
    <body>
        <h1>My 10 Favorite Things</h1>

        <script>
            // array of my favorite items
            var favorites = [
                "Laptop",
                "Projector",
                "Wedding ring",
                "Gaming console",
                "Shoes",
                "Funko Pops",
                "Record player",
                "Vinyls",
                "Tattoos",
                "Snacks"
            ];

            document.write("<ol>");

            // loop through all the values in the array
            for (var counter = 0; counter < favorites.length; counter++)
            {
                document.write("<li>" + favorites[counter] + "</li>");
            }

            document.write("</ol>");
        </script>
    </body>
</html>
